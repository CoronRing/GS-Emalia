<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Emalia logo: an envelope whose flap doubles as a graph of connected nodes">
  <title>Emalia</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- envelope body -->
  <rect x="96" y="144" width="320" height="224" rx="28"
        fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>

  <!-- the flap doubles as the edges of a graph -->
  <path d="M112 170 L256 286 L400 170"
        fill="none" stroke="#ffffff" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- nodes: two inputs converging on one agent -->
  <circle cx="112" cy="170" r="26" fill="#c4b5fd" stroke="#ffffff" stroke-width="14"/>
  <circle cx="400" cy="170" r="26" fill="#c4b5fd" stroke="#ffffff" stroke-width="14"/>
  <circle cx="256" cy="286" r="34" fill="#ffffff"/>
  <circle cx="256" cy="286" r="13" fill="#6d28d9"/>
</svg>
