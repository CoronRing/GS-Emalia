  <text class="m l8" y="292.0" xml:space="preserve"><tspan x="26.0" fill="#c9d1d9" textLength="72.0" lengthAdjust="spacingAndGlyphs">  smtp: </tspan><tspan x="98.0" fill="#3fb950" textLength="18.0" lengthAdjust="spacingAndGlyphs">ok</tspan></text>
