  <text class="m l16" y="500.0" xml:space="preserve"><tspan x="26.0" fill="#7d8590" textLength="495.0" lengthAdjust="spacingAndGlyphs">Emalia is watching assistant@gmail.com. Ctrl-C to stop.</tspan></text>
