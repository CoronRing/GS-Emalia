version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["ruff", "mypy", "pytest*", "build", "types-*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
