[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emalia"
dynamic = ["version"]
description = "An agent that lives in your email, and the IMAP/SMTP toolkit behind it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Guan Zheng Huang" }]
maintainers = [{ name = "CoronRing" }]
keywords = [
    "email",
    "email-agent",
    "email-automation",
    "email-bot",
    "imap",
    "smtp",
    "mailbox",
    "ai-agent",
    "llm",
    "llm-tools",
    "agent-tools",
    "railtracks",
    "assistant",
    "anthropic",
    "openai",
    "gmail",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# The mail toolkit itself needs nothing beyond the standard library. These four
# are what the agent, the HTTP tool, the CLI and .env loading need; keeping them
# in the core install is the difference between `pip install emalia` working and
# a first run that fails on a missing extra.
dependencies = [
    "python-dotenv>=1.0",
    "railtracks>=1.5.3",
    "requests>=2.28",
    "typer>=0.12",
]

[project.optional-dependencies]
# Provider SDKs. railtracks pulls in what it needs for most of these, but
# pinning them here makes `pip install emalia[anthropic]` a complete answer.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
all = ["emalia[anthropic,openai,gemini]"]
dev = [
    "emalia[all]",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "build>=1.0",
]

[project.scripts]
emalia = "emalia.cli:main"

[project.urls]
Homepage = "https://github.com/CoronRing/GS-Emalia"
Repository = "https://github.com/CoronRing/GS-Emalia"
Issues = "https://github.com/CoronRing/GS-Emalia/issues"
Changelog = "https://github.com/CoronRing/GS-Emalia/blob/main/CHANGELOG.md"
Documentation = "https://github.com/CoronRing/GS-Emalia/tree/main/docs"
Security = "https://github.com/CoronRing/GS-Emalia/blob/main/SECURITY.md"

[tool.hatch.version]
path = "src/emalia/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/emalia"]

[tool.hatch.build.targets.sdist]
include = [
    "src/emalia",
    "tests",
    "docs",
    "examples",
    "scripts",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: needs a real mail server or outbound network (deselect with -m 'not network')",
    "e2e: runs against a real mailbox; skipped unless EMALIA_E2E=1 (see docs/e2e-testing.md)",
    "llm: calls a real model, so it costs money (deselect with -m 'not llm')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is the formatter's job, not the linter's
    "B008",   # typer declares defaults as function calls by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
# `rt.agent_node` returns a class, so PascalCase is correct for what it binds.
"examples/*" = ["N806"]

[tool.mypy]
python_version = "3.11"
files = ["src/emalia"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# The tool bodies are nested functions whose signatures are read by railtracks
# at runtime; annotating the closures that build them adds noise without
# adding checking.
module = ["emalia.tools.*"]
disallow_untyped_defs = false

[tool.coverage.run]
source = ["emalia"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
